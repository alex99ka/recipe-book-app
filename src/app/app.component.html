<ion-app>
  @if (user(); as profile) {
    <ion-menu contentId="main-content" menuId="myMenu">
      <ion-header class="navigation-drawer">
        <div class="profil">
          <img class="profil-img" [src]="profile.photoURL" alt="" referrerpolicy="no-referrer" />
          <p class="profil-text">
            <b>{{ profile.displayName }}</b>
            <br /><span class="email">{{ profile.email }}</span>
          </p>
        </div>
      </ion-header>
      <ion-content class="ion-padding-vertical">
        <ion-menu-toggle>
          <ion-item
            button
            lines="none"
            routerLink="/home"
            routerLinkActive="selected"
            #homeLink="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <ion-icon
              slot="start"
              name="book"
              aria-hidden="true"
              [color]="homeLink.isActive ? 'primary' : 'medium'"
            ></ion-icon>
            <ion-label [color]="homeLink.isActive ? 'primary' : ''">המתכונים</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item button lines="none" routerLink="/inbox" routerLinkActive="selected" #inboxLink="routerLinkActive">
            <ion-icon slot="start" name="mail" aria-hidden="true" [color]="inboxLink.isActive ? 'primary' : 'medium'"></ion-icon>
            <ion-label [color]="inboxLink.isActive ? 'primary' : ''">התקבל מחברים</ion-label>
            @if (inboxCount()) {
              <ion-badge slot="end">{{ inboxCount() }}</ion-badge>
            }
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item button lines="none" routerLink="/friends" routerLinkActive="selected" #friendsLink="routerLinkActive">
            <ion-icon slot="start" name="people" aria-hidden="true" [color]="friendsLink.isActive ? 'primary' : 'medium'"></ion-icon>
            <ion-label [color]="friendsLink.isActive ? 'primary' : ''">חברים</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item button lines="none" (click)="openTodo()">
            <ion-icon slot="start" name="checkbox-outline" aria-hidden="true" color="medium"></ion-icon>
            <ion-label>משימות וקניות</ion-label>
            <ion-icon slot="end" name="open-outline" aria-hidden="true" color="medium"></ion-icon>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item
            button
            lines="none"
            routerLink="/settings"
            routerLinkActive="selected"
            #settingsLink="routerLinkActive"
          >
            <ion-icon
              slot="start"
              name="settings"
              aria-hidden="true"
              [color]="settingsLink.isActive ? 'primary' : 'medium'"
            ></ion-icon>
            <ion-label [color]="settingsLink.isActive ? 'primary' : ''">הגדרות</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item button lines="none" (click)="confirmSignOut()">
            <ion-icon slot="start" name="log-out" aria-hidden="true"></ion-icon>
            <ion-label>התנתקות</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-content>
    </ion-menu>
  }
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
