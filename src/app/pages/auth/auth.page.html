<ion-content [forceOverscroll]="false">
  <main class="welcome">
    <img class="logo" src="assets/imgs/logo.png" alt="" width="96" height="96" />
    <h1>ספר מתכונים</h1>
    <p class="lede">כל המתכונים של הבית בעברית: מקישור, מסרטון או מצילום, עם ספרי הבישול ומחירי המצרכים.</p>
    <ion-button expand="block" shape="round" class="google" (click)="signInGoogle()">
      <ion-icon slot="start" name="logo-google" aria-hidden="true"></ion-icon>
      כניסה עם Google
    </ion-button>
    <p class="fine">הספר פתוח רק למשפחה ולחברים שהוזמנו. מחשבון Google נשמרים רק השם והמייל.</p>
  </main>
</ion-content>
